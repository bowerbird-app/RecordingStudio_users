AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'test/tmp/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_users/authorization.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_users/authorization.rb'
    - 'lib/recording_studio_users/configuration.rb'
    - 'lib/recording_studio_users/services/**/*'
    - 'app/controllers/**/*'
    - 'app/helpers/**/*'
    - 'app/models/**/*'
    - 'db/migrate/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_users/configuration.rb'
    - 'lib/recording_studio_users/services/**/*'
    - 'app/controllers/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_users/services/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_users/services/**/*'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_users/authorization.rb'

Naming/PredicateMethod:
  Exclude:
    - 'lib/recording_studio_users/authorization.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'lib/recording_studio_users/services/**/*'
    - 'test/services/**/*'
