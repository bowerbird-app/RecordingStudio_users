AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'
    - 'lib/generators/**/templates/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_users/user_information_loader.rb'
    - 'lib/recording_studio_users.rb'
    - 'lib/recording_studio_users/configuration.rb'
    - 'lib/generators/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_users.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'app/controllers/recording_studio_users/users_controller.rb'
    - 'app/helpers/recording_studio_users/application_helper.rb'
    - 'lib/recording_studio_users.rb'
    - 'lib/recording_studio_users/admin.rb'
    - 'lib/recording_studio_users/avatar_authorization.rb'
    - 'lib/recording_studio_users/configuration.rb'
    - 'lib/recording_studio_users/services/**/*'
    - 'lib/recording_studio_users/user_information_loader.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'app/controllers/recording_studio_users/users_controller.rb'
    - 'lib/recording_studio_users.rb'
    - 'lib/recording_studio_users/avatar_authorization.rb'
    - 'lib/recording_studio_users/configuration.rb'
    - 'lib/recording_studio_users/provisioning_authorization.rb'
    - 'lib/recording_studio_users/services/**/*'
    - 'lib/recording_studio_users/user_information_loader.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_users.rb'
    - 'lib/recording_studio_users/avatar_authorization.rb'
    - 'lib/recording_studio_users/configuration.rb'
    - 'lib/recording_studio_users/provisioning_authorization.rb'
    - 'lib/recording_studio_users/services/**/*'
    - 'lib/recording_studio_users/user_information_loader.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_users.rb'
    - 'lib/recording_studio_users/avatar_authorization.rb'
    - 'lib/recording_studio_users/configuration.rb'
    - 'lib/recording_studio_users/provisioning_authorization.rb'
    - 'lib/recording_studio_users/services/**/*'
    - 'lib/recording_studio_users/user_information_loader.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_users.rb'
    - 'lib/recording_studio_users/services/**/*'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'app/components/**/*'
    - 'lib/recording_studio_users/services/**/*'
    - 'test/services/**/*'
